<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Kami - agas88.site</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/di8stbg60/image/upload/v1767425380/syam-digital-01_i5zfka.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .contact-container {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .contact-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .contact-header h1 {
            color: #004d40;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .contact-header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #004d40;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #004d40;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 12px;
        }
        .btn-submit:hover {
            background-color: #00332c;
        }
        .btn-submit:disabled {
            background-color: #a5d6a7;
            cursor: not-allowed;
        }
        .btn-view {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #004d40;
            border: 2px solid #004d40;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-view:hover {
            background-color: #e0f2f1;
            color: #00332c;
        }
        #status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-size: 14px;
        }
        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body>

<div class="contact-container">
    <div class="contact-header">
        <h1>Hubungi Kami</h1>
        <p>Silakan kirimkan pesan Anda, rekap akan otomatis tersimpan dalam sistem kami.</p>
    </div>

    <form id="contactForm">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" required placeholder="Masukkan nama Anda">
        </div>

        <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" name="email" required placeholder="nama@email.com">
        </div>

        <div class="form-group">
            <label for="telepon">Nomor WhatsApp / Telepon</label>
            <input type="tel" id="telepon" name="telepon" placeholder="08123456789">
        </div>

        <div class="form-group">
            <label for="subjek">Subjek / Topik</label>
            <input type="text" id="subjek" name="subjek" required placeholder="Topik pesan Anda">
        </div>

        <div class="form-group">
            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan" rows="5" required placeholder="Tuliskan pesan Anda di sini..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Kirim Pesan</button>
    </form>

    <!-- Tombol Lihat Pesan Rekap Spreadsheet -->
    <a href="https://docs.google.com/spreadsheets/d/1A8UmxLKjGJP2aIFG4O4Y5LQFwMhMWjwZz6rM52yt62c/edit?usp=sharing" 
       target="_blank" 
       rel="noopener noreferrer" 
       class="btn-view">
       📊 Lihat Pesan (Rekap Spreadsheet)
    </a>

    <div id="status-message"></div>
</div>

<script>
    // GANTI URL DI BAWAH DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxziPjziVjPjCZ5hKWiQ2CBRC5qqTXFsWYdrnzoIiAFQ1avp6afFUNrV7QucTzx420zbw/exec';

    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('status-message');

    form.addEventListener('submit', e => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = 'Mengirim...';
        statusMsg.style.display = 'none';

        const formData = new FormData(form);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(response => {
                statusMsg.className = 'success';
                statusMsg.innerText = 'Terima kasih! Pesan Anda berhasil terkirim dan direkap.';
                statusMsg.style.display = 'block';
                form.reset();
            })
            .catch(error => {
                statusMsg.className = 'error';
                statusMsg.innerText = 'Gagal mengirim pesan. Silakan coba lagi.';
                statusMsg.style.display = 'block';
                console.error('Error!', error.message);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Kirim Pesan';
            });
    });
</script>

</body>
</html>
